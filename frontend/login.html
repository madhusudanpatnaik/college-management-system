<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="College Management System — Secure role-based login for admins, faculty, and students." />
    <title>Login | DIET Engineering College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body class="auth-page" data-page="login">
    <main class="login-shell login-wrapper login-container">
      <section class="login-brand-panel login-left">
        <div class="login-brand-overlay overlay light-separator" aria-hidden="true"></div>
        <div class="login-brand-copy">
          <h1>DIET Engineering College</h1>
        </div>
        <div class="login-brand-header">
          <span class="login-brand-badge secure-pill">
            <span class="cms-mini">CMS</span>
            <span class="secure-pill-text">SECURE CAMPUS WORKSPACE</span>
          </span>
        </div>
      </section>
      <section class="login-form-panel login-right">
        <div class="login-form-card login-card">
          <div class="login-form-heading">
            <span class="login-form-kicker">Welcome Back</span>
            <h2>Sign in to continue</h2>
            <p>Choose your role and continue to your workspace.</p>
          </div>
          <form id="loginForm" class="login-form">
            <label class="login-field">
              <span class="login-field-label">Role</span>
              <span class="select-wrapper">
                <select name="role" id="loginRole" required autocomplete="off">
                  <option value="">Select your role</option>
                  <option value="admin">Admin</option>
                  <option value="faculty">Faculty</option>
                  <option value="student">Student</option>
                </select>
              </span>
            </label>
            <label class="login-field">
              <span class="login-field-label">Email address</span>
              <input type="email" name="email" id="loginEmail" placeholder="name@college.edu" required autocomplete="email" inputmode="email" />
            </label>
            <label class="login-field">
              <span class="login-field-label">Password</span>
              <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
            </label>
            <button class="button button-primary btn-primary login-submit" type="submit">Sign In</button>
          </form>
          <div class="login-secondary-row">
            <a class="login-secondary-link" href="forgot-password.html">Forgot Password?</a>
            <a class="button button-secondary login-secondary-button" href="#demoCredentialsTitle">Use Demo Access</a>
          </div>
          <div id="authMessage" class="inline-message hidden"></div>
        </div>

        <section class="login-demo-card" aria-labelledby="demoCredentialsTitle">
          <div class="login-demo-header">
            <div>
              <span class="login-form-kicker">Demo Credentials</span>
              <h3 id="demoCredentialsTitle">Click any role to autofill</h3>
            </div>
            <p>Instant access for testing.</p>
          </div>
          <div class="login-demo-grid demo-cards">
            <button
              class="login-demo-item demo-card"
              type="button"
              data-demo-role="admin"
              data-demo-email="admin@college.edu"
              data-demo-password="Admin@123"
            >
              <span class="login-demo-role role">Admin</span>
              <span class="login-demo-email email">admin@college.edu</span>
              <span class="login-demo-password password">Admin@123</span>
            </button>
            <button
              class="login-demo-item demo-card"
              type="button"
              data-demo-role="faculty"
              data-demo-email="faculty@college.edu"
              data-demo-password="Faculty@123"
            >
              <span class="login-demo-role role">Faculty</span>
              <span class="login-demo-email email">faculty@college.edu</span>
              <span class="login-demo-password password">Faculty@123</span>
            </button>
            <button
              class="login-demo-item demo-card"
              type="button"
              data-demo-role="student"
              data-demo-email="student@college.edu"
              data-demo-password="Student@123"
            >
              <span class="login-demo-role role">Student</span>
              <span class="login-demo-email email">student@college.edu</span>
              <span class="login-demo-password password">Student@123</span>
            </button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
